<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="主纵梁前端支撑安装候选示意">
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#9d7428"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#355464;font-size:15px}.tiny{font-size:12px;fill:#7b929d}.title{font-size:20px;font-weight:700}.dim{stroke:#a98235;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.lead{stroke:#8a9ca4;stroke-width:1.3;fill:none}</style>
<rect width="1100" height="650" fill="#fff"/><text x="35" y="40" class="title">安装候选 A · 主梁前端双托座</text><text x="35" y="65" class="tiny">设计定位示意，非工厂结构图；60 mm 来自用户，其余局部尺寸为讨论值。</text>
<text x="45" y="90">① 底部视角 · 中间留空</text>
<rect x="85" y="160" width="70" height="265" rx="8" fill="#436b80"/><rect x="415" y="160" width="70" height="265" rx="8" fill="#436b80"/><rect x="151" y="188" width="268" height="28" fill="#436b80"/>
<rect x="178" y="232" width="215" height="90" rx="12" fill="#d2dbdf"/><text x="240" y="273">下电机盖</text><text x="221" y="296" class="tiny">不作为承力安装面</text>
<path d="M206 335V133H365V335" stroke="#d3b667" stroke-width="20" fill="none"/><text x="248" y="352" class="tiny">抬升架包络</text>
<rect x="75" y="133" width="90" height="95" rx="5" fill="#80939d"/><rect x="405" y="133" width="90" height="95" rx="5" fill="#80939d"/>
<rect x="75" y="96" width="90" height="43" rx="10" fill="#ecb344"/><rect x="405" y="96" width="90" height="43" rx="10" fill="#ecb344"/>
<g fill="#f4f6f7" stroke="#3e5b6b" stroke-width="3"><circle cx="120" cy="167" r="7"/><circle cx="120" cy="201" r="7"/><circle cx="450" cy="167" r="7"/><circle cx="450" cy="201" r="7"/></g>
<path class="lead" d="M76 175H40V235"/><text x="35" y="256" class="tiny">两侧加强托座</text><path class="lead" d="M485 361H525V396"/><text x="357" y="447">两根主纵梁承力</text>
<text x="590" y="110">② 不抬升侧视 · 前端包络</text><rect x="719" y="173" width="330" height="65" rx="5" fill="#436b80"/><rect x="720" y="160" width="329" height="10" fill="#47565f"/><rect x="768" y="239" width="190" height="46" rx="8" fill="#d2dbdf"/>
<path d="M846 247L681 290" stroke="#d3b667" stroke-width="20"/><circle cx="683" cy="289" r="22" fill="#6e818b"/>
<rect x="647" y="181" width="135" height="18" rx="3" fill="#80939d"/><rect x="647" y="182" width="18" height="74" fill="#80939d"/><rect x="630" y="178" width="20" height="97" rx="5" fill="#ecb344"/>
<path d="M719 144V353M660 276V353M630 278V375" stroke="#c0ccd1" stroke-dasharray="4 4"/><path class="dim" d="M662 333H716"/><text x="665" y="326" class="tiny">60 mm</text><path class="dim" d="M633 365H716"/><text x="637" y="390" class="tiny">脚垫前伸 80 mm（候选）</text>
<path class="lead" d="M645 226H591V284"/><text x="571" y="310" class="tiny">软鞋端面</text><text x="783" y="151" class="tiny">跑台上方无电机凸盖</text><text x="789" y="317" class="tiny">下盖与支撑件留拆卸通道</text>
<path d="M35 480H1065" stroke="#dde5e8"/>
<text x="45" y="514">③ 竖放后的接地面</text><rect x="65" y="542" width="100" height="70" rx="10" fill="#ecb344"/><rect x="375" y="542" width="100" height="70" rx="10" fill="#ecb344"/><path d="M65 542H475V612H65Z" fill="none" stroke="#8fa6b1" stroke-dasharray="5 5"/><text x="192" y="565" class="tiny">重心投影须落在</text><text x="187" y="586" class="tiny">有效支撑区域内</text>
<text x="590" y="515">承力路径</text><text x="590" y="546">地面 → 软鞋 → 金属托座 → 主纵梁 / 前横梁</text><text x="590" y="577" class="tiny">左右脚座具有前后深度；不是两个点支撑。</text><text x="590" y="600" class="tiny">最终深度、软垫压缩、固定件和防倒措施需工厂验证。</text><text x="590" y="623" class="tiny">若再延长抬升架，必须同步重算脚垫包络。</text>
</svg>
