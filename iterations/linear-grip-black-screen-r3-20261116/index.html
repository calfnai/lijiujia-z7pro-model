caption></figure><figure id="04-heart-rate"><h2>心率监测把手</h2><button data-image="04-heart-rate.webp" data-title="心率监测把手"><img src="04-heart-rate.webp" alt="心率监测把手：按用户标准连接处更新" width="1536" height="1024" loading="lazy"></button><figcaption>黑屏 · 参考图深蓝波形侧饰 · 材质方案沿用 · 待评审</figcaption></figure><p>本轮调整示意图的连接处外观；不修改原STEP、原模型材质覆盖或已保留的其他选项。新图不表示结构、工艺或性能已通过验证。</p></main><dialog id="zoom"><header><span></span><button id="close">关闭 ×</button></header><img alt="放大图片"></dialog><script>const d=document.querySelector('dialog');document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>{d.querySelector('img').src=b.dataset.image;d.querySelector('span').textContent=b.dataset.title;d.showModal()});document.querySelector('#close').onclick=()=>d.close();d.onclick=e=>{if(e.target===d)d.close()};</script></html>
